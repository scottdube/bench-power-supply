; PlatformIO — ESP32-S3-Touch-LCD-5 (N16R8) bench supply
[env:esp32s3_bench]
platform  = espressif32
board     = esp32-s3-devkitc-1   ; 16MB flash / 8MB PSRAM variant
framework = arduino
monitor_speed = 115200

board_build.flash_size   = 16MB
board_build.arduino.memory_type = qio_opi   ; octal PSRAM (R8)
build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
  4-20ma/ModbusMaster @ ^2.0.1
  lvgl/lvgl @ ^8.4.0
  ; + Waveshare ESP32-S3-Touch-LCD-5 BSP for the RGB panel / GT911 touch /
  ;   CH422G expander. Pull it from Waveshare's demo and add here, then
  ;   implement board_io.h and ui_init()/ui_tick() against it.
